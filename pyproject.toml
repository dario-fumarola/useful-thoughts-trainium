[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainium-weekend-thinking"
version = "0.2.0"
description = "Controlled weekend research harness for useful self-generated thought"
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[tool.setuptools.packages.find]
include = ["weekend_thinking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
