[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "useful-thoughts-trainium"
version = "0.2.0"
description = "Controlled research on useful self-generated thought on AWS Trainium"
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[tool.setuptools.packages.find]
include = ["weekend_thinking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
